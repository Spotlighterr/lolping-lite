name: Release Windows Installer & EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Test & Vet
        shell: pwsh
        run: |
          go test ./...
          go vet ./...

      - name: Build lolPingLite.exe, Installer & ZIP
        shell: pwsh
        run: |
          go build -ldflags="-H windowsgui -s -w" -o lolPingLite.exe .

          # Portable ZIP
          New-Item -ItemType Directory -Force -Path dist/assets/emotes | Out-Null
          Copy-Item lolPingLite.exe dist/
          Copy-Item assets/emotes/*.frames dist/assets/emotes/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath lolPingLite-windows-amd64.zip -Force

          # Windows Installer (Inno Setup)
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          if (-not $ver -or $ver -eq 'main') { $ver = "1.0.2" }
          & $iscc "/DMyAppVersion=$ver" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            release/lolPingLite-Setup.exe
            lolPingLite-windows-amd64.zip
            lolPingLite.exe
